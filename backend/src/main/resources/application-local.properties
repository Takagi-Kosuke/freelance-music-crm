# Local profile for quick development preview without external PostgreSQL
spring.datasource.url=jdbc:h2:mem:freelance_music_crm;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

spring.flyway.enabled=false
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-local.sql

# Optional H2 console for local debug
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
