# Application
spring.application.name=freelance-music-crm

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/freelance_music_crm}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Session
server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.http-only=true

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://freelance-music-crm.vercel.app}

# JWT
app.jwt.secret=${APP_JWT_SECRET:change-me-please-use-a-strong-secret-key}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Proxy support for Railway / Vercel deployment
server.forward-headers-strategy=framework

# Mail (configure via environment variables in production)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.com.freelancemusiccrm=INFO
logging.level.org.springframework.security=WARN
